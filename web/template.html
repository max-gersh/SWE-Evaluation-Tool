*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.01em;text-wrap:balance}
.brand h1 .mark{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 30px 7px 10px;min-width:0;max-width:100%;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}

.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.notice b{color:var(--ink)}
.notice .tag{flex:none;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 6px;margin-top:1px}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.mapcard{position:relative;overflow:hidden}
#map{height:min(72vh,640px);min-height:420px;background:var(--map-bg)}
.leaflet-container{background:var(--map-bg);font-family:var(--font)}
.legend{position:absolute;left:10px;bottom:10px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;max-width:calc(100% - 20px)}
.legend .lt{font-weight:600;margin-bottom:5px;color:var(--ink)}
.legend .sw{display:flex;gap:0;align-items:stretch}
.legend .sw span{display:block;width:36px;height:10px}
.legend .ticks{display:flex;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend .ticks span{width:36px;text-align:left;font-size:10.5px;transform:translateX(-5px);white-space:nowrap}
.legend .ls{font-size:11px;color:var(--ink-2);margin:-2px 0 5px}
.legend .pl{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--ink-2)}
.legend .pl i{width:14px;height:0;border-top:2px dashed var(--ink-2)}
.legend .nd{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--ink-2)}
.legend .nd i{width:14px;height:10px;background:var(--nodata);border:1px solid var(--nodata-line)}
.maphint{position:absolute;right:10px;top:10px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--ink-2)}
.leaflet-tooltip.btip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:6px 9px;font-size:12px}
.leaflet-tooltip.btip:before{display:none}
.btip b{display:block;font-size:12.5px}
.btip .c{color:var(--muted);font-variant-numeric:tabular-nums}
.btip .v{font-variant-numeric:tabular-nums;margin-top:2px}
.lbl-state{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em}
.lbl-city{color:var(--ink-2);font-size:10.5px;white-space:nowrap;text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg),0 0 3px var(--map-bg)}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{display:none}

/* basin panel */
.panel{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bhead{display:flex;flex-direction:column;gap:4px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.bhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink-2);font-variant-numeric:tabular-nums;background:var(--surface-2)}
.chip.part{border-style:dashed;border-color:var(--ink-2);color:var(--ink);background:transparent;font-weight:600}
.btip .p{color:var(--ink-2);font-size:11.5px;margin-top:3px;max-width:240px;white-space:normal}
tr.excl td{color:var(--muted);font-style:italic}
.chip.ose{border-color:transparent;background:var(--accent-soft);color:var(--accent);font-weight:600}
.kpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}

<script id="sweet-data" type="application/json">__SWEET_DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("sweet-data").textContent);
const M = D.meta, B = D.basins, S = D.series, CL = D.clim || {};
const AF_TO_M3 = 1233.48183754752, M_PER_IN = 0.0254;
const PKEY = {SNODAS:"--s-snodas", UA_SWE:"--s-uaswe", CU_SWE:"--s-cuswe"};
const state = {level:"huc6", metric:"vol", di:M.dates.length-1, sel:null, tab:"ens", years:[]};
const H = D.hist || {};
const CUR = D.cur || {};   // current WY per product, whole season (unmasked), for the history panels
const YCOL = ["--y1","--y2","--y3","--y4","--y5"];
const LEVELS = ["huc6","huc8","huc12"].filter(lv=>D.geo[lv]&&D.geo[lv].features.length);
const LVL = l => String(l||"").toUpperCase();          // "huc12" -> "HUC12"

// ---------- helpers ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const fmtAF = v => v==null||isNaN(v) ? "—" : Math.round(v).toLocaleString("en-US");
const fmtK = v => v==null||isNaN(v) ? "—" : (Math.abs(v)>=1e6 ? (v/1e6).toFixed(2)+"M" : Math.abs(v)>=1e5 ? Math.round(v/1e3)+"k" : Math.abs(v)>=1e3 ? (v/1e3).toFixed(1)+"k" : Math.round(v).toString());
const fmtDate = (iso, yr=true) => new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:yr?"numeric":undefined});
const label = p => M.labels[p] || p;
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ensAt(code, i){ const s=S[code]; if(!s||!s.ens) return null; const v=s.ens.mean[i]; return v; }
function reportedAt(code,i){ const s=S[code]; return !!(s&&s.ens&&s.ens.rep[i]); }
function prodAt(code,p,i,masked){ const s=S[code]; const t=s&&(masked?(s.pm||s.p):s.p); return t&&t[p]?t[p][i]:null; }
function climMedian(p, code, dowy){   // linear interpolation between the sampled history days
  const c=CL[p], b=c&&c.b[code]; if(!b) return null;
  const d=c.d; let k=d.findIndex(x=>x>=dowy); if(k<0) return null;
  if(d[k]===dowy) return b.m[k]; if(k===0) return null;
  const a=b.m[k-1], z=b.m[k]; if(a==null||z==null) return null;
  return a+(z-a)*(dowy-d[k-1])/(d[k]-d[k-1]);
}
function pctMedian(p, code, i){
  const v=prodAt(code,p,i,false), m=climMedian(p,code,M.dowy[i]);
  if(v==null||m==null) return null; if(m<50) return (v<50? null : Infinity); return 100*v/m;
}
function wyDate(dowy){ // 365-day WY calendar -> ISO date in the current WY
  const d=new Date(Date.UTC(M.wy-1,9,1)); let n=dowy-1;
  while(n>0){ d.setUTCDate(d.getUTCDate()+1); if(!(d.getUTCMonth()===1&&d.getUTCDate()===29)) n--; }
  return d.toISOString().slice(0,10);
}

// ---------- metrics & scales ----------
const METRICS = [
  {id:"vol", label:"SWE — ensemble basin-average SWE volume (af)"},
  {id:"chg", label:"Change since previous week — SWE volume (af)"}]
  // % of median for every product, incl. those without a history yet (shown disabled)
  .concat([...new Set([...M.climProducts, ...M.products])].map(p=>({id:"pct:"+p, label:`% of median — ${label(p)}`,
    disabled: !M.climAvailable.includes(p), why: M.climProducts.includes(p)? "after backfill" : "no history yet"})));
const SEQV = ["--seq-0","--seq-1","--seq-2","--seq-3","--seq-4","--seq-5","--seq-6"];
const DIVV = ["--div-0","--div-1","--div-2","--div-3","--div-4","--div-5","--div-6"];
// SWE volume class lower bounds (af); fixed so colours compare across dates
const VOL = {huc12:[1,100,500,1e3,2.5e3,5e3,1e4], huc8:[1,1e3,5e3,1e4,2.5e4,5e4,1e5], huc6:[1,5e3,2.5e4,5e4,1e5,2.5e5,5e5]};
// change classes: |change| thresholds b1<b2<b3 (af) -> 7 classes, grey = |change| < b1
const CHG = {huc12:[100,1e3,5e3], huc8:[1e3,1e4,5e4], huc6:[5e3,5e4,2e5]};
const PCT = [0,50,70,90,110,130,150];
const lvlOf = code => (B[code]&&B[code].l) || state.level;
// date index one week before date index i: exactly 7 days earlier, else the
// latest date 8-10 days earlier (fills a missed day); null if there is none
const DAY = 864e5, tOf = iso => Date.parse(iso+"T00:00:00Z");
function weekI(i){
  if(i==null || i<0) return null;
  const t = tOf(M.dates[i]) - 7*DAY;
  for(let j=i-1; j>=0; j--){ const d=tOf(M.dates[j]);
    if(d>t) continue;
    return (t-d) <= 3*DAY ? j : null; }
  return null;
}
function metricValue(code, i){
  if(!S[code]) return null;
  if(state.metric==="chg"){
    const j=weekI(i); if(j==null) return null;
    const a=ensAt(code,i), b=ensAt(code,j); return (a==null||b==null)? null : a-b;
  }
  if(!reportedAt(code,i)) return null;
  if(state.metric==="vol") return ensAt(code,i);
  return pctMedian(state.metric.split(":")[1], code, i);
}
function classOf(v, code){
  if(v==null||isNaN(v)) return null;
  const lv=lvlOf(code);
  if(state.metric==="vol"){ const e=VOL[lv]; if(v<e[0]) return null; let k=0; e.forEach((x,j)=>{ if(v>=x) k=j; }); return SEQV[k]; }
  if(state.metric==="chg"){ const [b1,b2,b3]=CHG[lv];
    const k = v<=-b3?0 : v<=-b2?1 : v<=-b1?2 : v<b1?3 : v<b2?4 : v<b3?5 : 6; return DIVV[k]; }
  if(v===Infinity) return DIVV[6];
  let k=0; PCT.forEach((x,j)=>{ if(v>=x) k=j; }); return DIVV[k];
}
function colorFor(v, code){ const c=classOf(v,code); return c? css(c) : null; }
const fmtT = v => v>=1e6? (v/1e6)+"M" : v>=1e3? (v/1e3)+"k" : String(v);
const sgn = v => (v>0?"+":v<0?"−":"±") + fmtAF(Math.abs(v));
function metricText(code,i){
  const v=metricValue(code,i);
  if(!S[code]) return "No SWEET estimate yet";
  if(state.metric==="chg"){
    const j=weekI(i);
    if(j==null) return "No estimate from a week earlier";
    return v==null? "—" : `Change since ${fmtDate(M.dates[j],false)}: ${sgn(v)} af`;
  }
  if(!reportedAt(code,i)) return "No agreed snow on this date";
  if(state.metric==="vol") return v==null? "—" : `SWE volume: ${fmtAF(v)} af`;
  if(v===Infinity) return "Snow where the median is ~0";
  return v==null? "No historical median" : `${Math.round(v)}% of median`;
}
function partialNote(code){
  const b=B[code]; if(!b||!b.part) return "";
  return `Partial HUC6: total of the ${b.n8} included HUC8s (${Math.round(100*b.a/b.fa)}% of the HUC6 area)`;
}

// ---------- map ----------
// canvas rendering so the map can be exported as PNG
const map = L.map("map",{zoomSnap:0.25,attributionControl:false,preferCanvas:true});
// Optional basemap for hosted deployments, e.g. on drought.nm.gov:
// L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
const nbLayer = L.geoJSON(D.geo.nb,{interactive:false,style:()=>({color:css("--state-line"),weight:1,fillColor:css("--state-fill"),fillOpacity:1})}).addTo(map);
const layers = {};
function baseStyle(f){
  const code=f.properties.huc, c=colorFor(metricValue(code,state.di),code);
  const sel = code===state.sel;
  return {color: sel? css("--sel-line") : css("--basin-line"), weight: sel? 3 : 0.8, opacity:1,
          fillColor: c || css("--nodata"), fillOpacity: 1};
}
function tipHtml(code){
  const b=B[code]||{};
  const pn=partialNote(code);
  return `<b>${esc(b.n)}${b.part?" *":""}</b><div class="c">${LVL(b.l)} ${code}</div><div class="v">${esc(metricText(code,state.di))}</div>${pn?`<div class="p">* ${esc(pn)}</div>`:""}`;
}
for(const lv of LEVELS){
  layers[lv] = L.geoJSON(D.geo[lv],{
    style: baseStyle,
    onEachFeature:(f,l)=>{
      l.bindTooltip(()=>tipHtml(f.properties.huc),{sticky:true,className:"btip",direction:"top",offset:[0,-8]});
      l.on("click",()=>select(f.properties.huc));
      l.on("mouseover",()=>{ if(f.properties.huc!==state.sel) l.setStyle({weight:2.2,color:css("--sel-line")}); });
      l.on("mouseout",()=>l.setStyle(baseStyle(f)));
    }
  });
}
// HUC8 outlines for context under the (few, small) HUC12s
const ctx12 = L.geoJSON(D.geo.huc8,{interactive:false,style:()=>({color:css("--ink-2"),weight:0.8,opacity:0.7,fill:false})});
const fullLayer = L.geoJSON(D.geo.huc6full,{interactive:false,style:()=>({color:css("--ink-2"),weight:1.3,dashArray:"5 4",fill:false})});
const nmLayer = L.geoJSON(D.geo.nm,{interactive:false,style:()=>({color:css("--nm-line"),weight:2,fill:false})}).addTo(map);
const decor = L.layerGroup().addTo(map);
function drawDecor(){
  decor.clearLayers();
  const st={CO:[37.55,-105.3],AZ:[34.4,-109.55],TX:[32.35,-103.4],OK:[36.75,-102.75],UT:[37.55,-109.5]};
  for(const [n,ll] of Object.entries(st)) L.marker(ll,{interactive:false,icon:L.divIcon({className:"lbl-state",html:n,iconSize:[30,14]})}).addTo(decor);
  for(const [name,lat,lon] of M.cities){
    L.circleMarker([lat,lon],{radius:3,color:css("--map-bg"),weight:1.5,fillColor:css("--ink"),fillOpacity:1,interactive:false}).addTo(decor);
    L.marker([lat,lon],{interactive:false,icon:L.divIcon({className:"lbl-city",html:esc(name),iconSize:[90,14],iconAnchor:[-6,7]})}).addTo(decor);
  }
}
function showLevel(){
  for(const lv of LEVELS) map.removeLayer(layers[lv]);
  map.removeLayer(fullLayer); map.removeLayer(ctx12);
  if(state.level==="huc12") ctx12.addTo(map);
  layers[state.level].addTo(map);
  if(state.level==="huc6") fullLayer.addTo(map);
  nmLayer.bringToFront(); decor.eachLayer(l=>l.bringToFront&&l.bringToFront());
  for(const lv of ["huc6","huc8","huc12"]) $("lvl-"+lv).setAttribute("aria-pressed", state.level===lv);
}
function restyle(){ for(const lv of LEVELS) layers[lv].setStyle(baseStyle); ctx12.setStyle({color:css("--ink-2")}); nbLayer.setStyle({color:css("--state-line"),fillColor:css("--state-fill")}); nmLayer.setStyle({color:css("--nm-line")}); fullLayer.setStyle({color:css("--ink-2")}); }
function fit(){ map.fitBounds(nmLayer.getBounds(),{padding:[18,18]}); }

function drawLegend(){
  const lv=state.level, i=state.di;
  let title, sub="", vars, ticks;
  if(state.metric==="vol"){
    title="SWE volume (af) — SWEET ensemble mean"; vars=SEQV;
    ticks=VOL[lv].map((x,j)=>fmtT(x)+(j===VOL[lv].length-1?"+":""));
  } else if(state.metric==="chg"){
    const [b1,b2,b3]=CHG[lv];
    const j=weekI(i);
    title="Change in SWE volume over the previous week (af)"; vars=DIVV;
    sub = j!=null ? `${fmtDate(M.dates[j],false)} → ${fmtDate(M.dates[i],false)} · grey = within ±${fmtT(b1)}` : "No estimate from a week before this date";
    ticks=["",`−${fmtT(b3)}`,`−${fmtT(b2)}`,`−${fmtT(b1)}`,`+${fmtT(b1)}`,`+${fmtT(b2)}`,`+${fmtT(b3)}`];
  } else {
    title=`% of ${M.climPeriod} median, ${label(state.metric.split(":")[1])}`; vars=DIVV;
    ticks=["","50","70","90","110","130","150"];
  }
  const anyPartial = lv==="huc6" && D.geo.huc6full.features.length;
  state.leg = {title, sub, vars, ticks, nd: state.metric==="chg"?"No estimate":"No agreed snow or no estimate", partial: !!anyPartial};
  $("legend").innerHTML = `<div class="lt">${title}</div>${sub?`<div class="ls">${sub}</div>`:""}
    <div class="sw">${vars.map(v=>`<span style="background:${css(v)}"></span>`).join("")}</div>
    <div class="ticks">${ticks.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="nd"><i></i>${state.metric==="chg"?"No estimate":"No agreed snow or no estimate"}</div>
    ${anyPartial?`<div class="pl"><i></i>Full extent of a partial HUC6 (*)</div>`:""}`;
}

// ---------- panel ----------
function select(code){
  state.sel = code; restyle(); renderPanel();
}
function crumbs(code){
  const b=B[code]; if(!b) return "";
  const sep = `<span aria-hidden="true">›</span>`;
  if(b.l==="huc12"){
    const h6 = B[b.p6]? `<button type="button" data-huc="${b.p6}">${esc(B[b.p6].n)}</button>${sep}` : "";
    const h8 = B[b.p]&&!B[b.p].nogeom? `<button type="button" data-huc="${b.p}">${esc(B[b.p].n)}</button>${sep}` : "";
    return `${h6}${h8}<span>HUC12 ${code}</span>`;
  }
  if(b.l==="huc8"&&B[b.p]) return `<button type="button" data-huc="${b.p}">${esc(B[b.p].n)}</button>${sep}<span>HUC8 ${code}</span>`;

function kpiHtml(code){

  if(i>0){ const pv=s.ens.mean[i-1]; const d=(mean!=null&&pv!=null)? mean-pv : null;
    out.push(`<div class="kpi"><span class="k">Change since ${fmtDate(M.dates[i-1],false)}</span><span class="v">${d==null?"—":(d>=0?"▲ +":"▼ −")+fmtAF(Math.abs(d))} <small>af</small></span><span class="s">${d==null||!pv?"":((d/pv*100)>=0?"+":"")+(d/pv*100).toFixed(0)+"% in "+Math.round((new Date(M.dates[i])-new Date(M.dates[i-1]))/864e5)+" days"}</span></div>`); }

function subsHtml(code){

// ---------- chart ----------
const WYR = () => [`${M.wy-1}-10-01`, `${M.wy}-09-30`];      // water-year axis, Oct 1 - Sep 30
const alpha=(hex,a)=>{const h=hex.replace("#","");const n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};

const niceNum = v => { if(v<=0) return 0; const e=Math.pow(10,Math.floor(Math.log10(v))); const f=v/e; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e; };
function renderElev(){
  const code=state.sel, E=D.elev&&D.elev[code], el=$("elevchart"), i=state.di, bw=M.bandFt;
  const b=B[code]||{};
  $("elevtitle").textContent = `SWE volume by elevation band · ${fmtDate(M.dates[i],false)}`;
  if(!E || !E.m[i] || E.m[i].every(v=>v==null)){
    Plotly.purge(el); el.style.height="auto";
    el.innerHTML = `<div class="empty">${S[code]
      ? `<b>No elevation-band values for this ${LVL(b.l)} on this date yet.</b><br>They come from the statewide daily run (or, for WY${M.wy}, the weekly reports' Table 3 CSVs).`

    hasR&&E.lo[i][k]!=null ? `${fmtAF(E.lo[i][k])}–${fmtAF(E.hi[i][k])} af (low ${src(E.ls[i][k])}, high ${src(E.hs[i][k])})` : "n/a",

  if(hasR) tr.error_x={type:"data",symmetric:false,array:m.map((v,k)=>E.hi[i][k]==null?0:E.hi[i][k]-v),

  const eh = isFs($("elevbox")) ? availH($("elevbox"), el, 300) : Math.max(180, nb*30+70);

    margin:{l:8,r:16,t:4,b:40}, paper_bgcolor:"rgba(0,0,0,0)", plot_bgcolor:"rgba(0,0,0,0)",

    yaxis:{type:"category",categoryorder:"array",categoryarray:labs,title:{text:"Elevation band (ft)",font:{size:11.5,color:muted},standoff:14},ticks:"",ticklabelstandoff:6,automargin:true},

    ? `<span>Change since ${fmtDate(M.dates[j],false)} (af):</span><span><span class="sw">${DIVV.map(v=>`<span style="background:${css(v)}"></span>`).join("")}</span><span class="ticks">${["",`−${fmtT(th[2])}`,`−${fmtT(th[1])}`,`−${fmtT(th[0])}`,`+${fmtT(th[0])}`,`+${fmtT(th[1])}`,`+${fmtT(th[2])}`].map(t=>`<span>${t}</span>`).join("")}</span></span>${hasR?"<span>Whiskers: product min–max</span>":""}`
    : `<span>Bars: SWEET ensemble mean${j==null?" · first report of the season, no change shown":""}</span>${hasR?"<span>Whiskers: product min–max</span>":""}`;

  host.innerHTML = `<button type="button" class="vt" data-a="fs" title="Full screen" aria-label="Full screen">${ICON.fs}</button>`+
    `<button type="button" class="vt" data-a="png" title="Download PNG" aria-label="Download PNG">${ICON.png}</button>`+
    `<button type="button" class="vt" data-a="csv" title="Download CSV" aria-label="Download CSV">${ICON.csv}</button>`;
  host.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.a==="fs") toggleFs(box); else if(b.dataset.a==="png") png(); else csv(); });
}
const isFs = box => document.fullscreenElement===box || box.classList.contains("fs");
async function toggleFs(box){
  if(isFs(box)){
    if(document.fullscreenElement===box){ try{ await document.exitFullscreen(); }catch(e){} }
    box.classList.remove("fs"); afterFs(); return;
  }
  try{ if(!box.requestFullscreen) throw new Error("no fullscreen"); await box.requestFullscreen(); }
  catch(e){ box.classList.add("fs"); afterFs(); }            // fallback: fill the window
}
function afterFs(){
  document.querySelectorAll(".fsbox").forEach(b=>{ const t=b.querySelector('.vt[data-a="fs"]'); if(!t) return;
    const on=isFs(b); t.innerHTML = on? ICON.unfs : ICON.fs; t.title = on? "Exit full screen" : "Full screen"; t.setAttribute("aria-label", t.title); });
  setTimeout(()=>{ map.invalidateSize(); renderChart(); renderElev();
    ["chart","elevchart"].forEach(id=>{ const el=$(id); if(el && el.layout) Plotly.Plots.resize(el); }); }, 80);
}
document.addEventListener("fullscreenchange", afterFs);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && document.querySelector(".fsbox.fs")){
  document.querySelectorAll(".fsbox.fs").forEach(b=>b.classList.remove("fs")); afterFs(); } });
function availH(box, el, min){        // plot height that fills a full-screen box
  const cs=getComputedStyle(box); let other=0, n=0;
  for(const c of box.children){ if(c===el || c.hidden || c.offsetParent===null) continue; other+=c.offsetHeight; n++; }
  const gap=parseFloat(cs.rowGap)||parseFloat(cs.gap)||0;
  return Math.max(min, Math.floor(box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - other - gap*n - 4));
}
function saveBlob(blob, name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const slug = t => String(t||"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
const baseName = code => `SWEET_WY${M.wy}_${code}_${slug(B[code]&&B[code].n)}`;
function toCsv(header, rows){
  const q=v=> v==null||v===""? "" : (typeof v==="number"? String(Math.round(v*100)/100) : (/[",\n]/.test(v)? '"'+String(v).replace(/"/g,'""')+'"' : v));
  return "\ufeff"+[header.join(","), ...rows.map(r=>r.map(q).join(","))].join("\r\n");
}
const saveCsv = (name, header, rows) => saveBlob(new Blob([toCsv(header, rows)],{type:"text/csv;charset=utf-8"}), name+".csv");
async function plotPng(el, title, sub, name){
  if(!el || !el.layout) return;
  const L0=el.layout, bg=css("--surface"), add = sub? 58 : 40;
  const old={paper_bgcolor:L0.paper_bgcolor, plot_bgcolor:L0.plot_bgcolor, "title.text":"", "margin.t":L0.margin.t};
  await Plotly.relayout(el,{paper_bgcolor:bg, plot_bgcolor:bg, "margin.t":(L0.margin.t||8)+add,
    "title.text":`<b>${title}</b>`+(sub?`<br><span style="font-size:11.5px">${sub}</span>`:""), "title.x":0.01, "title.xanchor":"left",
    "title.yref":"container", "title.y":1, "title.yanchor":"top", "title.pad.t":18, "title.font.size":14, "title.font.color":css("--ink")});
  try{ await Plotly.downloadImage(el,{format:"png", filename:name, width:el.clientWidth, height:(L0.height||el.clientHeight)+add, scale:2}); }
  finally{ await Plotly.relayout(el,{...old, "title.text":""}); }
}
function basinTitle(code){ const b=B[code]||{}; return `${b.n||code}${b.part?" *":""} (${LVL(b.l)} ${code})`; }

// SWE chart
function sweCsv(){                     // ensemble tab only (no CSV on the history tab)
  const code=state.sel, s=S[code]; if(!s || state.tab!=="ens") return;
  const pm=s.pm||s.p||{}, pu=s.p||{}, P=M.products.filter(p=>pm[p]||pu[p]);
  const header=["date","products_available","ens_mean_af","ens_median_af","ens_min_af","ens_max_af","min_source","max_source",
    ...P.map(p=>`${p}_af_in_agreement_mask`), ...P.map(p=>`${p}_af_unmasked`)];
  const rows=M.dates.map((d,i)=>[d,(M.dateProducts&&M.dateProducts[i]||[]).join(" "),s.ens.mean[i],s.ens.median[i],s.ens.min[i],s.ens.max[i],
    s.ens.minsrc[i],s.ens.maxsrc[i], ...P.map(p=>pm[p]?pm[p][i]:null), ...P.map(p=>pu[p]?pu[p][i]:null)]);
  saveCsv(baseName(code)+"_ensemble", header, rows);
}
function swePng(){
  const code=state.sel; if(!S[code]) return;
  const sub = state.tab==="ens" ? `SWEET ensemble and products, WY${M.wy} · agreement mask ≥${M.minAgree} products ≥ ${M.threshold} in`
    : `Solid: WY${M.wy} · dashed: median ${M.climPeriod} · band: interquartile range${state.years.length?` · years: ${state.years.map(y=>"WY"+y).join(", ")}`:""}`;
  plotPng($("chart"), `SWE volume (af) · ${basinTitle(code)}`, sub, baseName(code)+(state.tab==="ens"?"_ensemble":"_history"));
}
// elevation chart
function elevCsv(){
  const code=state.sel, E=D.elev&&D.elev[code]; if(!E) return; const bw=M.bandFt, rows=[];
  M.dates.forEach((d,i)=>{ if(!E.m[i]) return; E.b.forEach((lo,k)=>{
    const v=E.m[i][k], pv=i>0&&E.m[i-1]? E.m[i-1][k] : null;
    rows.push([d,lo,lo+bw,v,E.lo[i]?E.lo[i][k]:null,E.hi[i]?E.hi[i][k]:null,E.ls[i]?E.ls[i][k]:null,E.hs[i]?E.hs[i][k]:null,(v!=null&&pv!=null)?v-pv:null]); }); });
  saveCsv(baseName(code)+"_elevation_bands", ["date","band_low_ft","band_high_ft","ens_mean_af","ens_min_af","ens_max_af","min_source","max_source","change_since_previous_af"], rows);
}
function elevPng(){
  const code=state.sel; if(!(D.elev&&D.elev[code])) return;
  plotPng($("elevchart"), `SWE volume by elevation band · ${basinTitle(code)}`, `${fmtDate(M.dates[state.di])} · bars: ensemble mean · whiskers: product min–max · colour: change since previous report`,
    baseName(code)+"_elevation_"+M.dates[state.di]);
}
// map
function mapCsv(){
  const i=state.di, lv=state.level, j=weekI(i), mlab=(METRICS.find(m=>m.id===state.metric)||{}).label||state.metric;
  const codes=D.geo[lv].features.map(f=>f.properties.huc);
  const header=["huc","name","level","parent_huc6","parent_huc8","area_km2","partial_huc6","date","map_shows","map_value","ens_mean_af","ens_median_af","ens_min_af","ens_max_af",
    "change_since_previous_week_af","previous_week_date", ...M.products.map(p=>`${p}_af`), ...M.climAvailable.map(p=>`pct_of_median_${p}`)];
  const rows=codes.map(c=>{ const b=B[c]||{}, s=S[c], e=s&&s.ens, pm=s&&(s.pm||s.p)||{};
    const v=metricValue(c,i), ch=(e&&j!=null&&e.mean[i]!=null&&e.mean[j]!=null)? e.mean[i]-e.mean[j] : null;
    return [c,b.n,LVL(lv),b.l==="huc12"?b.p6:(b.l==="huc8"?b.p:""),b.l==="huc12"?b.p:"",b.a,b.part?"yes":"",M.dates[i],mlab,(v===Infinity?null:v),
      e?e.mean[i]:null,e?e.median[i]:null,e?e.min[i]:null,e?e.max[i]:null,ch,j!=null?M.dates[j]:"", ...M.products.map(p=>pm[p]?pm[p][i]:null),
      ...M.climAvailable.map(p=>{ const x=pctMedian(p,c,i); return (x==null||!isFinite(x))? null : x; })]; });
  saveCsv(`SWEET_WY${M.wy}_map_${lv.toUpperCase()}_${M.dates[i]}_${slug(state.metric)}`, header, rows);
}
function mapPng(){
  const mEl=$("map"), mr=mEl.getBoundingClientRect(), W=Math.round(mr.width), Hm=Math.round(mr.height), top=46, s=2;
  const font=css("--font")||"sans-serif", ink=css("--ink"), ink2=css("--ink-2"), line=css("--line");
  const cv=document.createElement("canvas"); cv.width=W*s; cv.height=(Hm+top)*s;
  const g=cv.getContext("2d"); g.scale(s,s);
  g.fillStyle=css("--surface"); g.fillRect(0,0,W,Hm+top);
  g.save(); g.beginPath(); g.rect(0,top,W,Hm); g.clip();
  g.fillStyle=css("--map-bg"); g.fillRect(0,top,W,Hm);
  mEl.querySelectorAll("canvas").forEach(c=>{ const r=c.getBoundingClientRect(); g.drawImage(c, r.left-mr.left, r.top-mr.top+top, r.width, r.height); });
  // labels (HTML markers on the page, drawn here)
  const pt = ll => { const p=map.latLngToContainerPoint(ll); return [p.x, p.y+top]; };
  g.textBaseline="middle";
  g.fillStyle=css("--muted"); g.font=`700 11px ${font}`;
  [["CO",[37.55,-105.3]],["AZ",[34.4,-109.55]],["TX",[32.35,-103.4]],["OK",[36.75,-102.75]],["UT",[37.55,-109.5]]].forEach(([n,ll])=>{ const [x,y]=pt(ll); g.fillText(n,x-8,y); });
  g.font=`10.5px ${font}`;
  M.cities.forEach(([n,lat,lon])=>{ const [x,y]=pt([lat,lon]); g.lineWidth=3; g.strokeStyle=css("--map-bg"); g.strokeText(n,x+6,y); g.fillStyle=ink2; g.fillText(n,x+6,y); });
  // legend
  const L=state.leg||{}; const lx=10, lw=Math.max(260, 36*L.vars.length+20), lh=L.sub? 92 : 78, ly=top+Hm-lh-10+(L.partial?0:0);
  g.fillStyle=css("--surface"); g.strokeStyle=line; g.lineWidth=1; g.fillRect(lx,ly-(L.partial?16:0),lw,lh+(L.partial?16:0)); g.strokeRect(lx+.5,ly-(L.partial?16:0)+.5,lw-1,lh+(L.partial?16:0)-1);
  let y=ly-(L.partial?16:0)+14; g.fillStyle=ink; g.font=`600 11.5px ${font}`; g.fillText(L.title||"",lx+10,y);
  if(L.sub){ y+=15; g.fillStyle=ink2; g.font=`11px ${font}`; g.fillText(L.sub,lx+10,y); }
  y+=13; (L.vars||[]).forEach((v,k)=>{ g.fillStyle=css(v); g.fillRect(lx+10+k*36, y, 36, 10); });
  y+=20; g.fillStyle=ink2; g.font=`10.5px ${font}`; (L.ticks||[]).forEach((t,k)=>g.fillText(t, lx+10+k*36-4, y));
  y+=17; g.fillStyle=css("--nodata"); g.fillRect(lx+10,y-5,14,10); g.fillStyle=ink2; g.fillText(L.nd||"",lx+30,y);
  if(L.partial){ y+=16; g.strokeStyle=ink2; g.setLineDash([4,3]); g.beginPath(); g.moveTo(lx+10,y); g.lineTo(lx+24,y); g.stroke(); g.setLineDash([]); g.fillText("Full extent of a partial HUC6 (*)",lx+30,y); }
  g.restore();
  // title
  const mlab=(METRICS.find(m=>m.id===state.metric)||{}).label||"";
  g.fillStyle=ink; g.font=`600 14px ${font}`; g.textBaseline="alphabetic"; g.fillText(`SWEET Basin Explorer · ${state.level.toUpperCase()} · ${fmtDate(M.dates[state.di])}`,10,19);
  g.fillStyle=ink2; g.font=`12px ${font}`; g.fillText(mlab,10,37);
  cv.toBlob(b=>b&&saveBlob(b, `SWEET_WY${M.wy}_map_${state.level.toUpperCase()}_${M.dates[state.di]}.png`), "image/png");
}
function initTools(){
  makeTools($("maptools"), $("mapbox"), mapPng, mapCsv);
  makeTools($("swetools"), $("swebox"), swePng, sweCsv);
  makeTools($("elevtools"), $("elevbox"), elevPng, elevCsv);
}

// ---------- controls ----------
function initControls(){
  const mSel=$("metric");
  mSel.innerHTML = METRICS.map(m=>`<option value="${m.id}" ${m.disabled?"disabled":""}>${esc(m.label)}${m.disabled?` (${m.why})`:""}</option>`).join("");
  mSel.value=state.metric;
  mSel.onchange=()=>{state.metric=mSel.value; restyle(); drawLegend();};
  const dSel=$("date");
  const np_ = i => (M.dateProducts&&M.dateProducts[i]||[]).length;
  dSel.innerHTML = M.dates.map((d,i)=>`<option value="${i}">${fmtDate(d)}${np_(i) && np_(i)<M.products.length?` · ${np_(i)} products`:""}</option>`).join("");
  dSel.value=state.di;
  dSel.onchange=()=>{state.di=+dSel.value; restyle(); drawLegend(); renderPanel();};
  $("yearpick").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b||b.disabled) return;
    if(b.dataset.wy) return toggleYear(+b.dataset.wy);
    const pk=peakYears(state.sel);
    if(b.dataset.preset==="clear") state.years=[];
    else if(pk){ const wy=b.dataset.preset==="high"? pk.high : pk.low;
      if(!state.years.includes(wy) && state.years.length<YCOL.length) state.years.push(wy); }
    renderChart();
  });

  const setLevel = lv => {
    const was=state.level, b=B[state.sel];
    state.level=lv;
    // keep the selection meaningful: move up to the parent at coarser levels
    if(b && b.l==="huc12" && lv!=="huc12") state.sel = lv==="huc6"? b.p6 : (B[b.p]? b.p : b.p6);
    else if(b && b.l==="huc8" && lv==="huc6") state.sel = b.p;
    showLevel(); restyle(); drawLegend(); renderPanel();
    if(lv==="huc12") map.fitBounds(layers.huc12.getBounds(),{padding:[40,40],maxZoom:10});
    else if(was==="huc12") fit();
  };
  $("lvl-huc6").onclick=()=>setLevel("huc6");
  $("lvl-huc8").onclick=()=>setLevel("huc8");
  if(LEVELS.includes("huc12")) $("lvl-huc12").onclick=()=>setLevel("huc12");
  else $("lvl-huc12").hidden=true;
  $("tab-ens").onclick=()=>{state.tab="ens"; renderChart();};
  $("tab-hist").onclick=()=>{state.tab="hist"; renderChart();};
  const go=e=>{const t=e.target.closest("[data-huc]"); if(t) select(t.dataset.huc);};
  $("subs").addEventListener("click",go); $("crumbs").addEventListener("click",go);
  $("subs").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(e);} });
}
function initText(){
  const n = Object.keys(S).filter(c=>B[c]&&B[c].l==="huc8").length;
  const nAll = Object.values(B).filter(b=>b.l==="huc8").length;
  const n12 = Object.values(B).filter(b=>b.l==="huc12").length;
  const hist = M.climAvailable.length ? `Historical comparison: ${M.climAvailable.map(label).join(", ")} vs own ${M.climPeriod}.` : `Historical medians (${M.climPeriod}) are not loaded yet.`;
  $("notice").innerHTML = `<span class="tag">Prototype</span><span><b>WY${M.wy} values: ${esc(M.source)}</b>, ${n} of ${nAll} HUC8s (Rio Grande). ${hist} Latest: ${fmtDate(M.dates[M.dates.length-1])}.</span>`;
  $("foot").innerHTML = `
   <div><h4>Products</h4><p>SNODAS (NOAA NOHRSC, 1 km), SWANN / UA SWE (University of Arizona, 800 m) and CU SWE (INSTAAR, University of Colorado, 500 m), resampled to a common 500 m equal-area grid.</p></div>
   <div><h4>SWEET ensemble</h4><p>A pixel counts as snow-covered when at least ${M.minAgree} products report ≥ ${M.threshold} in of SWE. Inside that area each product's own value is used, including zeros; the ensemble is the mean of the product volumes. Basins without agreed snow are greyed out.</p></div>
   <div><h4>Boundaries &amp; history</h4><p>The ${nAll} USGS WBD HUC8s that intersect New Mexico plus the upstream Rio Grande and San Juan headwaters. HUC6 totals are the sum of the included HUC8s; HUC6s marked * extend beyond these HUC8s, so their totals do not cover the full HUC6 basin. ${n12?`The HUC12 tab shows ${n12} selected subwatersheds, computed on the same 500 m grid; they are reported on their own and are not part of the HUC8/HUC6 totals. `:""}Each product is compared only with its own ${M.climPeriod} record. Built ${esc(M.built)}.</p></div>`;
}

// ---------- boot ----------
initText(); initControls(); initTools(); drawDecor();
fit(); showLevel(); drawLegend();
select(S["130100"]? "130100" : Object.keys(S)[0]);
window.addEventListener("resize",()=>{ map.invalidateSize(); });
const retheme=()=>{ restyle(); drawDecor(); drawLegend(); renderChart(); renderElev(); };
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();
</script>
